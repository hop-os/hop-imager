# Release-machinerie voor hop-imager: bouwt op ÉCHTE runners per platform en
# hangt de resultaten aan twee plekken — de versietag en het rolling-kanaal.
#
# Waarom CI en niet één script op de Mac: Fyne is cgo + OpenGL, dus een
# macOS-machine kan geen Linux- of Windows-binary maken. Native runners is de
# enige eerlijke weg; hetzelfde patroon dat HopOS en de SURF-apps gebruiken (een
# vaste `rolling-release`-tag die altijd de nieuwste artefacten draagt, naast de
# genummerde releases die blijven staan).
#
#	git tag v1.0.0 && git push origin v1.0.0     → release + rolling-release
#	(of handmatig: Actions → Release → Run workflow)
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          # GEEN macOS-job. Niet omdat het niet zou bouwen, maar omdat een
          # runner Dereks Developer ID niet heeft: hij zou een ad-hoc
          # ondertekende app opleveren, en die weigert macOS bij een download
          # met als enige uitweg "naar prullenmand". De macOS-asset komt daarom
          # van tools/notarize-publish.sh op een machine mét het certificaat —
          # universal binary, ondertekend, genotariseerd en gestapeld. Zodra het
          # certificaat als secret in deze repo staat kan die job hier terug.
          - os: ubuntu-latest
            goos: linux
            goarch: amd64
            asset: hop-imager-linux-amd64.tar.gz
          - os: windows-latest
            goos: windows
            goarch: amd64
            asset: hop-imager-windows-amd64.zip
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache: true

      # Fyne op Linux: OpenGL, X11 én WAYLAND. GLFW 3.4 compileert beide
      # backends, dus zonder de wayland-headers faalt de build op
      # wayland-client-core.h (gemeten 07-08). libdecor hoort erbij: dat is wat
      # GLFW op wayland voor vensterranden gebruikt.
      - name: Linux build deps
        if: matrix.goos == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgl1-mesa-dev xorg-dev libxkbcommon-dev \
            libwayland-dev wayland-protocols libdecor-0-dev

      - name: Version
        id: v
        shell: bash
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Build Linux
        if: matrix.goos == 'linux'
        run: |
          go build -trimpath -ldflags "-X main.version=${{ steps.v.outputs.version }}" -o hop-imager .
          tar czf "${{ matrix.asset }}" hop-imager README.md LICENSE

      - name: Build Windows
        if: matrix.goos == 'windows'
        shell: bash
        run: |
          go build -trimpath -ldflags "-H windowsgui -X main.version=${{ steps.v.outputs.version }}" -o hop-imager.exe .
          7z a "${{ matrix.asset }}" hop-imager.exe README.md LICENSE >/dev/null

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: ${{ matrix.asset }}

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      # SHA256SUMS dekt wat in DEZE run gebouwd is; de macOS-asset wordt er
      # lokaal aan toegevoegd (die hoort bij een certificaat dat hier niet is).
      - name: Checksums
        run: |
          cd dist
          sha256sum * > SHA256SUMS
          cat SHA256SUMS

      # De genummerde release: blijft staan, is waar je naar kunt verwijzen.
      - name: Tagged release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1 &&
            gh release upload "${GITHUB_REF_NAME}" --clobber dist/* ||
            gh release create "${GITHUB_REF_NAME}" --title "hop-imager ${GITHUB_REF_NAME}" \
              --notes-file .github/release-notes.md dist/*

      # Het rolling-kanaal: altijd de nieuwste build, één vaste URL. Zelfde
      # afspraak als bij de SURF-apps, zodat een download-link nooit verandert.
      - name: Rolling release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release view rolling-release >/dev/null 2>&1 ||
            gh release create rolling-release --title "hop-imager (rolling)" \
              --notes "Always the latest hop-imager build. Numbered releases stay put; this tag moves." --prerelease
          gh release upload rolling-release --clobber dist/*
